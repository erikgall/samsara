name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: 12, testbench: 10, dependency-version: prefer-stable }
          - { php: '8.3', laravel: 12, testbench: 10, dependency-version: prefer-stable }
          - { php: '8.3', laravel: 13, testbench: 11, dependency-version: prefer-stable }
          - { php: '8.4', laravel: 12, testbench: 10, dependency-version: prefer-stable }
          - { php: '8.4', laravel: 13, testbench: 11, dependency-version: prefer-stable }
          - { php: '8.2', laravel: 12, testbench: 10, dependency-version: prefer-lowest }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies (${{ matrix.dependency-version }})
        # Temporary constraints preserve composer.json for release-content checks.
        run: |
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress \
            --with="illuminate/http:^${{ matrix.laravel }}.0" \
            --with="illuminate/collections:^${{ matrix.laravel }}.0" \
            --with="illuminate/support:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:^${{ matrix.testbench }}.0"

      - name: Show resolved versions
        run: |
          jq -r '.packages[]|select(.name=="laravel/framework")|.name + " " + .version' composer.lock
          jq -r '.["packages-dev"][]|select(.name=="orchestra/testbench" or .name=="phpunit/phpunit" or .name=="phpstan/phpstan")|.name + " " + .version' composer.lock

      - name: Restore release lockfile for content verification
        # Installed vendor packages retain the matrix versions shown above.
        run: git restore --source=HEAD -- composer.lock

      - name: Run phpunit
        run: composer test

      - name: Run phpstan
        run: composer analyse

      - name: Run pint --test
        run: composer format:test

  maintenance:
    name: Contract and release maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Run dependency-free maintenance checks
        run: composer check:maintenance

  formatting:
    name: Agent and maintenance artifact formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install formatting dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check
